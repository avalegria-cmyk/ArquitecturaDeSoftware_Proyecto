name: uniequipos-micro
services:
  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:80"
    depends_on:
      - gateway
  gateway:
    build: ./api-gateway
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-3000}:3000"
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8088}
      MONOLITO_URL: http://monolito
      NOTIFICACIONES_URL: http://notificaciones:3007
      IDENTIDAD_URL: http://identidad:3001
      # El gateway valida cada sesión con el servicio de Identidad.
      AUTH_URL: http://identidad:3001/internal/verify
    depends_on:
      - monolito
      - notificaciones
      - identidad
  identidad:
    build: ./servicio_identidad
    environment:
      DB_HOST: mysql
      DB_NAME: identidad_db
      DB_USER: identidad
      DB_PASSWORD: ${IDENTIDAD_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    depends_on:
      mysql:
        condition: service_healthy
  # MySQL de los microservicios: identidad_db y reportes_db, cada una con su propio usuario.
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MICRO_MYSQL_ROOT_PASSWORD}
      IDENTIDAD_DB_PASSWORD: ${IDENTIDAD_DB_PASSWORD}
      REPORTES_DB_PASSWORD: ${REPORTES_DB_PASSWORD}
    volumes:
      - micro_mysql_data:/var/lib/mysql
      - ./docker/mysql/01-bases.sh:/docker-entrypoint-initdb.d/01-bases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  # Copia una sola vez los datos del monolito a las bases nuevas (se puede repetir sin duplicar).
  migracion:
    build: ./migracion
    restart: "no"
    environment:
      LEGACY_DB_HOST: db
      LEGACY_DB_NAME: ${MYSQL_DATABASE}
      LEGACY_DB_USER: ${MYSQL_USER}
      LEGACY_DB_PASSWORD: ${MYSQL_PASSWORD}
      MICRO_MYSQL_HOST: mysql
      IDENTIDAD_DB_PASSWORD: ${IDENTIDAD_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      mysql:
        condition: service_healthy
      identidad:
        condition: service_started
  notificaciones:
    build: ./servicio_notificaciones
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
  # Monolito original: sigue atendiendo lo que todavía no se migró (patrón Strangler).
  monolito:
    image: nginx:stable-alpine
    volumes:
      - ./docker/monolito/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      DB_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8088}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      NOTIFICACIONES_URL: http://notificaciones:3007/internal/events
    depends_on:
      db:
        condition: service_healthy
  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "127.0.0.1:${PMA_PORT:-8089}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql_data:
  micro_mysql_data:
