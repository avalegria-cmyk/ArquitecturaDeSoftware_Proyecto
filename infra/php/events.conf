; Pool separado: las conexiones SSE no ocupan workers de login/operaciones.
[events]
user = www-data
group = www-data
listen = 9001
pm = ondemand
pm.max_children = 24
pm.process_idle_timeout = 10s
pm.max_requests = 200
catch_workers_output = yes
clear_env = no
request_terminate_timeout = 60s
php_admin_value[memory_limit] = 64M
