# Sirve el frontend React y envía todas las llamadas /api al API Gateway (Spring Boot).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    location ~ ^/api/(loans/(start|return)|maintenance/complete)$ {
        client_max_body_size 6m;
        proxy_pass http://gateway:3000;
    }
    location ~ ^/api/equipment(/update)?$ {
        client_max_body_size 28m;
        proxy_pass http://gateway:3000;
    }
    location = /api/events {
        proxy_pass http://gateway:3000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 65s;
        gzip off;
    }
    location /api/ {
        proxy_pass http://gateway:3000;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri /index.html; }
}
