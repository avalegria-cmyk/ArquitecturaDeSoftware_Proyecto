# Monolito PHP expuesto por HTTP para que el API Gateway le envíe lo que aún no se migró (Strangler).
server {
    listen 80;
    server_name _;
    client_max_body_size 30m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php api:9000;
    set $php_eventos api:9001;
    location = /api/events {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_pass $php_eventos;
        fastcgi_buffering off;
        fastcgi_cache off;
        fastcgi_read_timeout 65s;
        gzip off;
    }
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_pass $php;
    }
    location / { return 404; }
}
