name: Pruebas de los microservicios
# Integración continua: cada microservicio se prueba por separado, con su propio lenguaje.
on: [push, pull_request]

jobs:
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  gateway:
    name: API Gateway (Spring Boot)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api-gateway } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      # Reintenta las descargas de Maven Central si la red falla.
      - run: mvn -B package -Daether.connector.http.retryHandler.count=5 -Daether.connector.requestTimeout=60000

  identidad:
    name: Identidad (PHP)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: servicio_identidad } }
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: pdo_mysql, coverage: none }
      - run: composer install --no-interaction --prefer-dist
      - run: composer test

  catalogo:
    name: Catálogo (AdonisJS)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: servicio_catalogo } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: npm, cache-dependency-path: servicio_catalogo/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: node ace test

  reservas:
    name: Reservas (NestJS)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: servicio_reservas } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: npm, cache-dependency-path: servicio_reservas/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  prestamos:
    name: Préstamos (Rust)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: servicio_prestamos } }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  mantenimiento:
    name: Mantenimiento (Bun)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: servicio_mantenimiento } }
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test

  reportes:
    name: Reportes (FastAPI)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: servicio_reportes } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests

  notificaciones:
    name: Notificaciones (Go)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: servicio_notificaciones } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: '1.25' }
      - run: go test ./...
